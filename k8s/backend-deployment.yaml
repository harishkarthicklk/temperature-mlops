apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: mlops-backend:v8
        imagePullPolicy: Never

        env:
        - name: MODEL_VERSION
          value: "v7"

        ports:
        - containerPort: 8000